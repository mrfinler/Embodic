name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Gate profile of tools/ci.py
        type: choice
        options: [commit, nightly, release]
        default: commit

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'nightly') || 'commit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Gates
        run: python tools/ci.py --profile ${{ env.PROFILE }}
      - name: Trace matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/trace_matrix.md
          if-no-files-found: ignore

  # The UI tests need PySide6 (extra desktop-dev) and run on Qt's offscreen platform (tests/ui/conftest.py).
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop-dev]"
      - name: UI tests
        run: python -m pytest -p no:cacheprovider -m "not slow and not manual" tests/ui
