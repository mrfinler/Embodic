name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Gate profile of tools/ci.py
        type: choice
        options: [commit, nightly, release]
        default: commit

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'nightly') || 'commit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Gates
        run: python tools/ci.py --profile ${{ env.PROFILE }}
      - name: Trace matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/trace_matrix.md
          if-no-files-found: ignore
