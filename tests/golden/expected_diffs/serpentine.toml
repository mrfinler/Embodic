# Intentional differences between embodic and Xcoil v3 for the serpentine golden cases (owner: U-M3a, then via Fable).
# Schema and semantics: tools/golden/README.md, section "Allow-lists".
# The signoff fields hold the worker's proposal until Agent 2 and Agent 4 answer through Fable.

schema_version = 1

[[diff]]
id = "XD-SER-002-01"
case = "layout-seeded-03"
path = "$.verdict"
eq_id = "EQ-30"
reason = "With more than one strand per turn the terminal via sits at the middle of the T bus (Xcoil buildCanonical l.505-507, drcLayer touchesBus l.608). The T-junction exemption of D-035 b (interfaces.md section 7, rule 5) now covers the strand ends that land on a bus, but the via lies on the bus mid-path and is no path end, and no rule exempts a same-net via from the same-net copper it sits on, so embodic reports the bus against the via. Xcoil skips the first and last 1.6 pitch of a strand next to its bus; where a strand side passes within clearance of that via embodic reports the strand as well (layout-seeded-03, layout-strands-3-turns-2). Open: extend the tap clause to same-net vias, or cut the T bus at its terminal via, as the star ring is cut (deviation D-1 of the U-M3a report)."
agent2_signoff = "pending: proposed by U-M3a, not yet answered"
agent4_signoff = "pending: proposed by U-M3a, not yet answered"

