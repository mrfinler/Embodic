[[diff]]
id = "XD-SER-002-01"
case = "layout-seeded-03"
path = "$.verdict"
eq_id = "EQ-30"
reason = "With more than one strand per turn the terminal via sits at the middle of the T bus (Xcoil buildCanonical l.505-507, drcLayer touchesBus l.608). The T-junction exemption of D-035 b (interfaces.md section 7, rule 5) covers the strand ends that land on the bus, and the same-net via tap of D-036 a (rule 2b) exempts the via from the bus it sits on. Xcoil skips the first and last 1.6 pitch of a strand next to its bus; embodic does not, so a strand side that passes within clearance of that via is still reported. Faithful port (D-013), no geometry change in Phase 2 (D-036 a). Measured on this case: 4 trace_via pairs per board, strand sides against the terminal vias at -0.2078 mm clearance (rule 0.155 mm)."
